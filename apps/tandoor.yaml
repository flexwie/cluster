apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: tandoor
  namespace: flux-system
spec:
  interval: 5m0s
  url: oci://ghcr.io/gabe565/charts/tandoor
  ref:
    tag: 0.9.7
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tandoor
  namespace: apps
spec:
  chartRef:
    kind: OCIRepository
    name: tandoor
    namespace: flux-system
  interval: 10m
  values:
    ingress:
      main:
        enabled: true
        className: tailscale
        tls:
          - hosts:
              - tandoor
